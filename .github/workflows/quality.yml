name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/financial-vault-ai

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create local-mode environment file
        working-directory: app
        run: touch .env
      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get
      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: app
        run: flutter test
      - name: Resolve parser dependencies
        working-directory: packages/spendwise_parser
        run: dart pub get
      - name: Parser tests
        working-directory: packages/spendwise_parser
        run: dart test
      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload SpendWise APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-Android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build side-by-side beta APK
        working-directory: app
        run: |
          sed -i 's/applicationId = "com.spendwise.spendwise"/applicationId = "com.spendwise.spendwise.beta"/' android/app/build.gradle.kts
          sed -i 's/android:label="SpendWise"/android:label="SpendWise Beta"/' android/app/src/main/AndroidManifest.xml
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SpendWise-Beta.apk
      - name: Upload SpendWise Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-Beta-Android
          path: app/build/app/outputs/flutter-apk/SpendWise-Beta.apk
          if-no-files-found: error
          retention-days: 14

  bank-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-transform-types --test supabase/tests/aggregator.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/aggregator-*/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase init
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Verify owner isolation and credential permissions
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/rls.sql
      - if: always()
        run: supabase stop --no-backup

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: touch app/.env
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build ios --release --no-codesign

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source for exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: '1'
